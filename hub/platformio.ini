; SpectralGrid hub. Open items #2-#4 in SpectralGrid.md §12 are unverified.
[env:hub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_field.csv
build_flags =
    -I ../shared
    -DROLE_HUB=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:tools/embed_dashboard.py
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson @ ^7
    fastled/FastLED @ ^3.6.0

; On-device diagnostics for single-board bring-up (SpectralGrid.md §12). Flash with: pio run -e bringup -t upload
[env:bringup]
extends = env:hub
build_flags =
    ${env:hub.build_flags}
    -DBRINGUP
